<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <defs>
    <linearGradient id="bgGradient16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5DC;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#E6E6FA;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9ACD32;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="letterP16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D1B5F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A2C7A;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="letterL16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8C44F;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="letterE16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F5132;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D8B47;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="letterN16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#87A96B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A6C285;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="letterA16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D1B5F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F5132;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo con gradiente sutil -->
  <rect width="16" height="16" fill="url(#bgGradient16)" rx="2" ry="2"/>
  
  <!-- Letras PLENA estilizadas -->
  <g font-family="serif" font-weight="700" font-size="2.5" text-anchor="middle">
    <!-- P -->
    <text x="2" y="9.5" fill="url(#letterP16)">P</text>
    <!-- L -->
    <text x="4.5" y="9.5" fill="url(#letterL16)">L</text>
    <!-- E -->
    <text x="7" y="9.5" fill="url(#letterE16)">E</text>
    <!-- N -->
    <text x="9.5" y="9.5" fill="url(#letterN16)">N</text>
    <!-- A -->
    <text x="12" y="9.5" fill="url(#letterA16)">A</text>
  </g>
  
  <!-- Palabra "studio" muy pequeña -->
  <text x="8" y="13" font-family="sans-serif" font-size="1" font-weight="400" text-anchor="middle" fill="#87A96B" opacity="0.8">studio</text>
  
  <!-- Línea decorativa -->
  <line x1="1.5" y1="10.5" x2="14.5" y2="10.5" stroke="url(#letterA16)" stroke-width="0.2" opacity="0.6"/>
</svg>
